name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MedSeek
        run: python -m pip install -e ".[dev]"
      - name: Run lint checks
        run: ruff check medseek tests prepare_data.py run_train.py run_retrieval.py run_evaluate.py
      - name: Run offline tests
        run: pytest -q

